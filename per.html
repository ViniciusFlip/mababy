<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
setDoc,
doc,
serverTimestamp,
onSnapshot,
query,
orderBy
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* FIREBASE */

const firebaseConfig={

apiKey:"AIzaSyC4cm0X3mkkrw7eJL_omUoYsd9FNokc-Ik",
authDomain:"mababy-3cc1a.firebaseapp.com",
projectId:"mababy-3cc1a",
storageBucket:"mababy-3cc1a.firebasestorage.app",
messagingSenderId:"345205459376",
appId:"1:345205459376:web:c2872657f251a12e5fee75"

};


const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);
const googleProvider=new GoogleAuthProvider();


/* ELEMENTOS */

const login=document.getElementById("login");
const appTela=document.getElementById("app");
const google=document.getElementById("google");
const erro=document.getElementById("erro");
const usuario=document.getElementById("usuario");
const sair=document.getElementById("sair");

const modal=document.getElementById("modal");
const form=document.getElementById("form");
const titulo=document.getElementById("titulo");
const texto=document.getElementById("texto");
const feed=document.getElementById("feed");

let tipo="";


/* LOGIN */

google.onclick=async()=>{

  try{

    erro.textContent="Entrando...";

    await signInWithPopup(
      auth,
      googleProvider
    );

  }catch(e){

    console.error(e);
    erro.textContent="Não foi possível entrar.";

  }

};


/* SESSÃO */

onAuthStateChanged(auth,async user=>{

  if(user){

    login.classList.add("hidden");
    appTela.classList.remove("hidden");

    usuario.textContent=user.displayName;

    await setDoc(
      doc(db,"usuarios",user.uid),
      {
        nome:user.displayName,
        email:user.email,
        foto:user.photoURL,
        atualizadoEm:serverTimestamp()
      },
      {merge:true}
    );

  }else{

    appTela.classList.add("hidden");
    login.classList.remove("hidden");

  }

});


/* SAIR */

sair.onclick=()=>signOut(auth);


/* MODAL */

window.abrir=t=>{

  tipo=t;

  titulo.textContent=t;

  modal.classList.remove("hidden");
  modal.classList.add("flex");

  texto.focus();

};


window.fechar=()=>{

  modal.classList.add("hidden");
  modal.classList.remove("flex");

  form.reset();

};


/* REGISTRO */

form.onsubmit=async e=>{

  e.preventDefault();

  const user=auth.currentUser;

  if(!user)return;

  try{

    await addDoc(
      collection(db,"familia"),
      {
        uid:user.uid,
        nome:user.displayName,
        tipo,
        mensagem:texto.value.trim(),
        criadoEm:serverTimestamp()
      }
    );

    fechar();

  }catch(e){

    console.error(e);
    alert("Erro ao registrar.");

  }

};


/* FEED */

const q=query(
  collection(db,"familia"),
  orderBy("criadoEm","desc")
);


onSnapshot(q,snapshot=>{

  feed.innerHTML="";

  if(snapshot.empty){

    feed.innerHTML=`

      <div
      class="p-6 rounded-3xl
      bg-white
      border border-pearl-300
      text-center
      shadow-soft">

        <div
        class="w-10 h-10 mx-auto
        rounded-full
        bg-pearl-200
        flex items-center justify-center
        text-pearl-700">

          ◌

        </div>

        <p
        class="text-sm
        text-pearl-700
        mt-3">

          Nenhuma atividade registrada.

        </p>

      </div>

    `;

    return;

  }


  snapshot.forEach(d=>{

    const x=d.data();

    const data=x.criadoEm?.toDate();

    const hora=data
      ?data.toLocaleString("pt-BR",{
        day:"2-digit",
        month:"2-digit",
        hour:"2-digit",
        minute:"2-digit"
      })
      :"agora";


    feed.innerHTML+=`

      <article
      class="p-4 rounded-3xl
      bg-white
      border border-pearl-300
      shadow-soft">

        <div
        class="flex justify-between
        items-start gap-3">

          <div>

            <p class="font-semibold">
              ${x.nome||"Usuário"}
            </p>

            <span
            class="inline-block
            text-[10px]
            text-pearl-700
            bg-pearl-200
            px-2.5 py-1
            rounded-full mt-1">

              ${x.tipo}

            </span>

          </div>

          <span
          class="text-[10px]
          text-pearl-500">

            ${hora}

          </span>

        </div>


        <p
        class="text-sm
        text-pearl-800
        leading-relaxed
        mt-4">

          ${x.mensagem}

        </p>

      </article>

    `;

  });

});

</script>

</body>
